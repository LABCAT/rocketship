# Gated preview deployment for the Rocketship Storybook.
#
# A visible preview is published only after the PR agent marks the PR
# merge-ready by adding the `preview-ready` label (see opencode-review.yml).
# The label is the single gate:
#   - label present  -> build Storybook and publish exactly one preview
#   - label absent   -> no preview at all
#   - label removed  -> no new preview is published; Cloudflare keeps serving
#     the last gated preview, which is acceptable because it was published for
#     an earlier reviewed head
#
# Why `workflow_run` and not only `pull_request: [labeled]`: when the review
# workflow adds the label with the Actions `GITHUB_TOKEN`, GitHub does not fire
# a `pull_request` `labeled` event (that is how it prevents recursive runs).
# `workflow_run` is the documented exception, so this workflow starts when
# `opencode-review` finishes and checks the label itself. The `labeled` trigger
# is kept so a preview is still published when a human or an app token adds the
# label directly.
#
# Production is untouched: this workflow only ever publishes previews and never
# deploys the production branch.

name: preview-deploy

on:
  workflow_run:
    workflows: [opencode-review]
    types: [completed]
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  deployments: write
  actions: read

concurrency:
  group: preview-deploy-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  resolve:
    if: github.event_name == 'workflow_run' || github.event.label.name == 'preview-ready'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.resolve.outputs.ready }}
      number: ${{ steps.resolve.outputs.number }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve the pull request and check the gate
        id: resolve
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let number, sha;

            if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;
              if (run.conclusion !== 'success') return;
              const pr = run.pull_requests?.[0];
              if (!pr) return;
              number = pr.number;
              sha = run.head_sha;
            } else {
              if (context.payload.label?.name !== 'preview-ready') return;
              number = context.payload.pull_request.number;
              sha = context.payload.pull_request.head.sha;
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.head.repo?.full_name !== `${owner}/${repo}`) return;
            const ready = pr.labels.some((l) => l.name === 'preview-ready');

            core.setOutput('ready', String(ready));
            core.setOutput('number', String(number));
            core.setOutput('sha', sha);
            core.info(`PR #${number} at ${sha}: preview-ready=${ready}`);

  preview:
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds packages/* and the static Storybook at apps/frontend/storybook-static.
      - run: pnpm build

      - name: Deploy gated preview
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy apps/frontend/storybook-static
            --project-name=rocketship3000
            --branch=preview-${{ needs.resolve.outputs.number }}

      - name: Comment the preview URL
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
          PR_NUMBER: ${{ needs.resolve.outputs.number }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const body = url
              ? `Preview-ready — gated preview published at ${url}`
              : 'Preview-ready — gated preview published (no URL in the action output).';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            });
