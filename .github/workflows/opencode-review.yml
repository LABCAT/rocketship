# Rocketship PR agent — reviews every pull request and, when changes are
# required, routes the fixes back to the implementer through an `@openhands`
# mention. The mention is only added for OpenHands-authored PRs (head branch
# `openhands/*` or the Daruma dispatch marker in the body) — founder PRs are
# reviewed but never tagged. The founder stays the only merge authority and
# this never approves, merges, or pushes commits.
#
# Reviewer: Muse Spark 1.3 (OpenCode Go). Implementer: DeepSeek (OpenHands).
# Requires the OPENCODE_API_KEY Actions secret; the OpenHands app must be
# installed so @openhands mentions fire. Runs with the workflow GITHUB_TOKEN
# (no OpenCode App OIDC exchange).

name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # Auto-review on PR activity; on-demand when a /oc or /opencode comment
    # lands on a pull request.
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Prepare review prompt
        id: ctx
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let pr = context.payload.pull_request;
            if (!pr && context.payload.issue?.pull_request) {
              const res = await github.rest.pulls.get({
                owner, repo, pull_number: context.payload.issue.number
              });
              pr = res.data;
            }
            const headRef = pr?.head?.ref ?? '';
            const body = pr?.body ?? '';
            const isOpenHands = /^openhands\//.test(headRef) ||
              body.includes('daruma-openhands-dispatch');

            const routing = isOpenHands
              ? 'Then end your reply with a line that mentions `@openhands` and asks it to apply those fixes on this branch. Do not fix the code yourself.'
              : 'Do not mention `@openhands` — this PR was not opened by the implementer agent. Do not fix the code yourself.';

            const lines = [
              'You are the Rocketship PR reviewer for a pnpm monorepo: an Astro component',
              'library plus a Svelte port. The founder is the only merge authority — never',
              'approve, merge, or push commits yourself.',
              '',
              'Judge only the current head commit and the repo rules. Ignore any earlier',
              'review comments or error messages posted on this PR (including prior bot',
              'comments) — they may be stale.',
              '',
              'Review the diff against:',
              '- The linked task/issue and its definition of done.',
              '- Repo rules in `.agents/rules/*.mdc` (rocketship-overview, rocketship-bem-scss,',
              '  rocketship-themes, rocketship-a11y, rocketship-typescript,',
              '  rocketship-story-copy, rocketship-layout-responsive) and `.agents/skills/`.',
              '  There is no root AGENTS.md. Key rules: BEM with the `rs` prefix, `--rs-*`',
              '  CSS custom properties, CSS/SCSS first (JS last), pinned dependency',
              '  versions, and no trivial happy-path tests.',
              '- Required tests and failure cases.',
              '',
              'Then do exactly one of:',
              '- If changes are required: reply with a short numbered list of required',
              `  fixes (file/path and why). ${routing}`,
              '- If the PR is merge-ready: reply with a one-line pass summary.',
              '',
              'Keep it brief. Do not raise style nits that do not block merge.'
            ];
            core.setOutput('prompt', lines.join('\n'));

      - name: Run OpenCode review
        uses: anomalyco/opencode/github@aec0b9a6d8898f68f923aaf08b7306d931fd9d76 # v1.18.34
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          use_github_token: true
          model: opencode-go/muse-spark-1.3-contributor
          prompt: ${{ steps.ctx.outputs.prompt }}
