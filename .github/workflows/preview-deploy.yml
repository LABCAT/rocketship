# Gated preview deployment for the Rocketship Storybooks.
#
# A visible preview is published only after Kinsho (the shared reviewer, see
# opencode-review.yml) passes the current head and adds the `pr-ready` label.
# The label is the single gate:
#   - label present  -> build the affected Storybook(s) and publish preview(s)
#   - label absent   -> no preview at all
#   - label removed  -> no new preview is published; Cloudflare keeps serving
#     the last gated preview, which is acceptable because it was published for
#     an earlier reviewed head
#
# The workflow picks the Storybook previews from the changed files:
#   - Astro Storybook  -> rocketship3000 (apps/astro, packages/base)
#   - Svelte Storybook -> rocketship3030 (apps/svelte, packages/svelte, and the
#     base styles and tokens it imports)
# pnpm-lock.yaml and the root package.json affect both hosts. A PR that touches
# neither Storybook gets no preview.
#
# Why `workflow_run` and not only `pull_request: [labeled]`: when the review
# workflow adds the label with the Actions `GITHUB_TOKEN`, GitHub does not fire
# a `pull_request` `labeled` event (that is how it prevents recursive runs).
# `workflow_run` is the documented exception, so this workflow starts when
# `opencode-review` finishes and checks the label itself. The `labeled` trigger
# is kept so a preview is still published when a human or an app token adds the
# label directly.
#
# Production is untouched: this workflow only ever publishes previews and never
# deploys the production branch.

name: preview-deploy

on:
  workflow_run:
    workflows: [opencode-review]
    types: [completed]
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  deployments: write
  actions: read

concurrency:
  group: preview-deploy-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  resolve:
    if: github.event_name == 'workflow_run' || github.event.label.name == 'pr-ready'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.resolve.outputs.ready }}
      number: ${{ steps.resolve.outputs.number }}
      sha: ${{ steps.resolve.outputs.sha }}
      astro: ${{ steps.resolve.outputs.astro }}
      svelte: ${{ steps.resolve.outputs.svelte }}
    steps:
      - name: Resolve the pull request and check the gate
        id: resolve
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let number, sha;

            if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;
              if (run.conclusion !== 'success') return;
              const pr = run.pull_requests?.[0];
              if (!pr) return;
              number = pr.number;
              sha = run.head_sha;
            } else {
              if (context.payload.label?.name !== 'pr-ready') return;
              number = context.payload.pull_request.number;
              sha = context.payload.pull_request.head.sha;
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.head.repo?.full_name !== `${owner}/${repo}`) return;
            const ready = pr.labels.some((l) => l.name === 'pr-ready');

            // Svelte uses only the base styles and tokens, not the Astro components.
            // The lockfile and root package.json rebuild both Storybooks.
            const astroPaths = ['packages/base/', 'apps/astro/'];
            const sveltePaths = ['packages/base/src/styles/', 'packages/base/src/tokens/', 'packages/svelte/', 'apps/svelte/'];
            const sharedPaths = ['pnpm-lock.yaml', 'package.json'];

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: number, per_page: 100
            });

            const touched = (prefixes) =>
              prefixes.some((prefix) =>
                prefix.endsWith('/')
                  ? files.some((file) => file.filename.startsWith(prefix))
                  : files.some((file) => file.filename === prefix)
              );

            const shared = touched(sharedPaths);
            const astro = shared || touched(astroPaths);
            const svelte = shared || touched(sveltePaths);

            core.setOutput('ready', String(ready));
            core.setOutput('number', String(number));
            core.setOutput('sha', sha);
            core.setOutput('astro', String(astro));
            core.setOutput('svelte', String(svelte));
            core.info(`PR #${number} at ${sha}: pr-ready=${ready}, astro=${astro}, svelte=${svelte}`);

  preview:
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Install pnpm
        if: needs.resolve.outputs.astro == 'true' || needs.resolve.outputs.svelte == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Install Node
        if: needs.resolve.outputs.astro == 'true' || needs.resolve.outputs.svelte == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        if: needs.resolve.outputs.astro == 'true' || needs.resolve.outputs.svelte == 'true'
        run: pnpm install --frozen-lockfile

      # Both Storybook hosts consume the built packages/* output.
      - name: Build packages
        if: needs.resolve.outputs.astro == 'true' || needs.resolve.outputs.svelte == 'true'
        run: pnpm run build:packages

      - name: Build Astro Storybook
        if: needs.resolve.outputs.astro == 'true'
        run: pnpm run build:storybook

      - name: Build Svelte Storybook
        if: needs.resolve.outputs.svelte == 'true'
        run: pnpm run build:storybook:svelte

      - name: Deploy Astro preview
        id: deploy_astro
        if: needs.resolve.outputs.astro == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy apps/astro/storybook-static
            --project-name=rocketship3000
            --branch=preview-${{ needs.resolve.outputs.number }}

      - name: Deploy Svelte preview
        id: deploy_svelte
        if: needs.resolve.outputs.svelte == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy apps/svelte/storybook-static
            --project-name=rocketship3030
            --branch=preview-${{ needs.resolve.outputs.number }}

      - name: Comment the preview URL(s)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.number }}
          ASTRO: ${{ needs.resolve.outputs.astro }}
          SVELTE: ${{ needs.resolve.outputs.svelte }}
          ASTRO_URL: ${{ steps.deploy_astro.outputs.deployment-url }}
          SVELTE_URL: ${{ steps.deploy_svelte.outputs.deployment-url }}
        with:
          script: |
            const lines = [];
            const add = (label, deployed, url) => {
              if (deployed !== 'true') return;
              lines.push(`- ${label}: ${url || 'published (no URL in the action output)'}`);
            };
            add('Astro Storybook (rocketship3000)', process.env.ASTRO, process.env.ASTRO_URL);
            add('Svelte Storybook (rocketship3030)', process.env.SVELTE, process.env.SVELTE_URL);

            const body = lines.length
              ? `Preview-ready — gated preview published:\n${lines.join('\n')}`
              : 'Preview-ready — no Astro or Svelte Storybook changes detected, so no preview was published.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            });
