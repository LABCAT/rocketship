# Fast checks that enforce the agent rules on every PR: component style lint, the token map
# staying in sync with the DTCG JSON, Svelte type checks, the packages/svelte unit tests and the
# Svelte Storybook host tests.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint component styles
        run: pnpm lint:styles

      # Before the build: `build` regenerates the map, which would hide a stale commit.
      - name: Token map matches the JSON
        run: pnpm --filter @labcat2020/rocketship test

      - name: Build packages
        run: pnpm run build:packages

      - name: Svelte type check
        run: pnpm --filter @labcat2020/rocketship-svelte check

      - name: Svelte unit tests
        run: pnpm --filter @labcat2020/rocketship-svelte test

      - name: Svelte Storybook host tests
        run: pnpm --filter @rocketship/svelte-storybook test
