# Throwaway: end-to-end check of LABCAT/kinsho#3. Not merged.
name: kinsho-tools-test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    uses: LABCAT/kinsho/.github/workflows/review.yml@2997d82e917e4ddb502aacc95871cb87b64bf150
    with:
      test_command: |
        node -e "const os=require('os');console.log('sandbox user:',os.userInfo().username,'| OPENCODE_API_KEY visible:',!!process.env.OPENCODE_API_KEY,'| GH_TOKEN visible:',!!process.env.GH_TOKEN)"
      check_command: ls
      review_rules: |
        2. End-to-end tool check on a throwaway PR. Ignore what the diff contains. Do these four
           things once each, in this order, and quote what each returned: (a) a GET with
           kinsho-gh.mjs `api repos/LABCAT/rocketship/environments`; (b) fetch
           https://docs.github.com/en/rest/deployments/environments; (c) run kinsho-exec.mjs test;
           (d) try `git push origin HEAD` and report that it was denied. Then give a PASS.
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      KINSHO_APP_ID: ${{ secrets.KINSHO_APP_ID }}
      KINSHO_APP_PRIVATE_KEY: ${{ secrets.KINSHO_APP_PRIVATE_KEY }}
