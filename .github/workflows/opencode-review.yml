# Rocketship PR agent — conducts OpenHands-authored PRs (head branch
# `openhands/*`). Reviews the diff and, when changes are required, routes the
# fixes back to the implementer through an `@openhands` mention on the PR.
# Founder PRs are out of scope; the founder stays the only merge authority and
# this never approves, merges, or pushes commits.
#
# Reviewer: Muse Spark 1.3 (OpenCode Go). Implementer: DeepSeek (OpenHands).
# Requires the OPENCODE_API_KEY Actions secret; the OpenHands app must be
# installed so @openhands mentions fire. Runs with the workflow GITHUB_TOKEN
# (no OpenCode App OIDC exchange).

name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # Only conduct PRs the implementer opened (openhands/* branches).
    if: startsWith(github.head_ref, 'openhands/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run OpenCode review
        uses: anomalyco/opencode/github@aec0b9a6d8898f68f923aaf08b7306d931fd9d76 # v1.18.34
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          use_github_token: true
          model: opencode-go/muse-spark-1.3-contributor
          prompt: |
            You are the Rocketship PR reviewer for a pnpm monorepo: an Astro
            component library plus a Svelte port. A coding agent (OpenHands)
            opened this PR. The founder is the only merge authority — never
            approve, merge, or push commits yourself.

            Review the diff against:
            - The linked task/issue and its definition of done.
            - Repo rules in `.agents/rules/*.mdc` (rocketship-overview,
              rocketship-bem-scss, rocketship-themes, rocketship-a11y,
              rocketship-typescript, rocketship-story-copy,
              rocketship-layout-responsive) and `.agents/skills/`. There is no
              root AGENTS.md. Key rules: BEM with the `rs` prefix, `--rs-*` CSS
              custom properties, CSS/SCSS first (JS last), pinned dependency
              versions, and no trivial happy-path tests.
            - Required tests and failure cases.

            Then do exactly one of:
            - If changes are required: reply with a short numbered list of
              required fixes (file/path and why), then end your reply with a
              line that mentions `@openhands` and asks it to apply those fixes
              on this branch. Do not fix the code yourself.
            - If the PR is merge-ready: reply with a one-line pass summary.

            Keep it brief. Do not raise style nits that do not block merge.
