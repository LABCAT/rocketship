# Throwaway: end-to-end check of LABCAT/kinsho#3. Not merged.
name: kinsho-tools-test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    uses: LABCAT/kinsho/.github/workflows/review.yml@8d41f81a52bb1cdc95dd662af06340749abeb029
    with:
      test_command: |
        node -e "const os=require('os');console.log('sandbox user:',os.userInfo().username,'| OPENCODE_API_KEY visible:',!!process.env.OPENCODE_API_KEY,'| GH_TOKEN visible:',!!process.env.GH_TOKEN)"
      check_command: ls
      review_rules: |
        2. Tool check for this test PR. Before your verdict, run `node .kinsho/.github/scripts/kinsho-exec.mjs test`
           and quote its output, then attempt `git push origin HEAD` once and quote the result, so the
           log shows the allowed command and the denied one.
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      KINSHO_APP_ID: ${{ secrets.KINSHO_APP_ID }}
      KINSHO_APP_PRIVATE_KEY: ${{ secrets.KINSHO_APP_PRIVATE_KEY }}
