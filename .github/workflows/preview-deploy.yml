# Gated preview deployment for the Rocketship Storybook.
#
# A visible preview is published only after the PR agent marks the PR
# merge-ready by adding the `preview-ready` label (see opencode-review.yml).
# The label is the single gate:
#   - `preview-ready` added    -> build Storybook and publish exactly one preview
#   - `preview-ready` removed  -> nothing new is published (a later review asked
#     for changes); Cloudflare keeps serving the last gated preview
#   - no label                 -> no preview at all
#
# Production is untouched: this workflow only runs for pull requests and only
# ever deploys previews (the head branch is never the production branch).
#
# One Cloudflare Pages setting is required (founder action, described in the
# PR): automatic preview branch deployments must be turned off for the project
# so nothing is published before the label is added.

name: preview-deploy

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: preview-deploy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.label.name == 'preview-ready'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds packages/* and the static Storybook at apps/frontend/storybook-static.
      - run: pnpm build

      - name: Deploy gated preview
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy apps/frontend/storybook-static
            --project-name=rocketship3000
            --branch=preview-${{ github.event.pull_request.number }}

      - name: Comment the preview URL
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const body = url
              ? `Preview-ready — gated preview published at ${url}`
              : 'Preview-ready — gated preview published (no URL in the action output).';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
