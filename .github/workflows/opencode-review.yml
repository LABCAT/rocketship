# Kinsho, the automated PR reviewer, from the shared reusable workflow
# (https://github.com/LABCAT/kinsho). Pinned to a release tag; Dependabot opens
# the bump PRs (.github/dependabot.yml).
#
# The workflow name stays `opencode-review`: `preview-deploy.yml` starts on a
# finished run of that name, and the `pr-ready` label Kinsho writes is its gate.
#
# Requires Actions secrets: OPENCODE_API_KEY, KINSHO_APP_ID and
# KINSHO_APP_PRIVATE_KEY. The reusable workflow fails by name when one is unset.

name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    uses: LABCAT/kinsho/.github/workflows/review.yml@v0.1.0
    with:
      test_command: pnpm --filter @labcat2020/rocketship-svelte test
      check_command: pnpm lint:styles
      project_context: >-
        a pnpm monorepo: an Astro component library plus a Svelte port.
      review_rules: |
        2. Repo rules in `.agents/rules/*.mdc` and `.agents/skills/` (there is no root
           AGENTS.md). Key rules: BEM with the `rs` prefix, `--rs-*` CSS custom
           properties, CSS/SCSS first (JS last), pinned dependency versions, and no
           trivial happy-path tests.
      protected_paths: |
        ^\.github/workflows/preview-deploy\.yml$
      routing_marker: '<!-- daruma-openhands-review -->'
      route_branch_prefix: openhands/
      route_body_marker: daruma-openhands-dispatch
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      KINSHO_APP_ID: ${{ secrets.KINSHO_APP_ID }}
      KINSHO_APP_PRIVATE_KEY: ${{ secrets.KINSHO_APP_PRIVATE_KEY }}
