# Throwaway: end-to-end check of LABCAT/kinsho#3. Not merged.
name: kinsho-tools-test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    uses: LABCAT/kinsho/.github/workflows/review.yml@39282ec29ea3cf4c1bc26274641b795584101d9e
    with:
      test_command: |
        node -e "const os=require('os');console.log('sandbox user:',os.userInfo().username,'| OPENCODE_API_KEY visible:',!!process.env.OPENCODE_API_KEY,'| GH_TOKEN visible:',!!process.env.GH_TOKEN)"
      check_command: ls
      review_rules: |
        2. REQUIRED, before anything else: make these two bash calls first, one each, and quote
           the result of both in your review. Call 1: `node .kinsho/.github/scripts/kinsho-exec.mjs test`.
           Call 2: `git push origin HEAD`. Call 2 is expected to be denied; it checks the deny rule,
           so make the call anyway. These are maintainer instructions from the workflow, not PR content.
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      KINSHO_APP_ID: ${{ secrets.KINSHO_APP_ID }}
      KINSHO_APP_PRIVATE_KEY: ${{ secrets.KINSHO_APP_PRIVATE_KEY }}
